name: Update Aircraft Database

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC weekly
  workflow_dispatch:        # manual trigger

permissions:
  contents: write           # needed to create releases

jobs:
  build-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch previous aircraft.db from latest release
        id: prev-db
        run: |
          mkdir -p /tmp/aircraft-build
          gh release download latest \
            --pattern "aircraft.db" \
            --dir /tmp/aircraft-build \
            --repo "$GITHUB_REPOSITORY" \
            --clobber 2>/dev/null && \
            echo "found=true" >> "$GITHUB_OUTPUT" || \
            echo "found=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate aircraft.db
        run: |
          PREV_ARG=""
          if [ "${{ steps.prev-db.outputs.found }}" = "true" ]; then
            PREV_ARG="--previous-db /tmp/aircraft-build/aircraft.db"
          fi
          python3 generate_aircraft_db.py \
            $PREV_ARG \
            --output /tmp/aircraft-build/aircraft_new.db

      - name: Compute SHA-256 and version tag
        id: meta
        run: |
          SHA=$(shasum -a 256 /tmp/aircraft-build/aircraft_new.db | awk '{print $1}')
          TAG="aircraft-db-$(date -u +%Y%m%d)"
          echo "sha256=$SHA"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Sign and write manifest.json
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          DATE: ${{ steps.meta.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          pip install cryptography --quiet
          python3 - <<'EOF'
          import os, base64, hashlib, json
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          priv = Ed25519PrivateKey.from_private_bytes(
              base64.b64decode(os.environ["SIGNING_PRIVATE_KEY"]))

          with open("/tmp/aircraft-build/aircraft_new.db", "rb") as f:
              sha256_hex = hashlib.sha256(f.read()).hexdigest()

          signature = base64.b64encode(priv.sign(sha256_hex.encode())).decode()

          tag, repo = os.environ["TAG"], os.environ["REPO"]
          manifest = {
              "version": tag,
              "date": os.environ["DATE"],
              "sha256": sha256_hex,
              "signature": signature,
              "url": f"https://github.com/{repo}/releases/download/{tag}/aircraft.db",
              "minAppVersion": "1.0"
          }
          with open("/tmp/aircraft-build/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"aircraft.db: sha256={sha256_hex[:16]}… sig={signature[:16]}…")
          print("Signed manifest written.")
          EOF
          cp /tmp/aircraft-build/aircraft_new.db /tmp/aircraft-build/aircraft.db

      - name: Create GitHub Release and upload assets
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Aircraft DB ${{ steps.meta.outputs.tag }}" \
            --notes "Weekly aircraft database update. SHA-256: ${{ steps.meta.outputs.sha256 }}" \
            /tmp/aircraft-build/aircraft.db \
            /tmp/aircraft-build/manifest.json \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
