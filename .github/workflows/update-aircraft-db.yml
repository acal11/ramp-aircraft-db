name: Update Aircraft Database

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC weekly
  workflow_dispatch:        # manual trigger
    inputs:
      previous_tag:
        description: "Release to merge from instead of the latest (e.g. aircraft-db-20261005 to recover from a bad build)"
        required: false
        default: ""
      seed_tag:
        description: "Older release used only to fill operators nothing newer has (e.g. aircraft-db-20260803, the last with Canadian operators)"
        required: false
        default: ""
      allow_shrink:
        description: "Publish even if the release gate reports a large drop (only for a confirmed upstream change)"
        type: boolean
        default: false

permissions:
  contents: write           # needed to create releases

jobs:
  build-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch previous aircraft.db
        id: prev-db
        # No tag argument means the latest release. The tag `latest` does not exist
        # (releases are tagged aircraft-db-YYYYMMDD), so naming it failed every run,
        # the failure was swallowed, and --previous-db never loaded.
        run: |
          mkdir -p /tmp/aircraft-build
          if [ -n "$PREVIOUS_TAG" ]; then
            gh release download "$PREVIOUS_TAG" --pattern "aircraft.db" \
              --dir /tmp/aircraft-build --repo "$GITHUB_REPOSITORY" --clobber
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh release list --limit 1 --repo "$GITHUB_REPOSITORY")" ]; then
            gh release download --pattern "aircraft.db" \
              --dir /tmp/aircraft-build --repo "$GITHUB_REPOSITORY" --clobber
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}

      - name: Fetch seed aircraft.db
        if: ${{ inputs.seed_tag != '' }}
        run: |
          mkdir -p /tmp/aircraft-seed
          gh release download "$SEED_TAG" --pattern "aircraft.db" \
            --dir /tmp/aircraft-seed --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_TAG: ${{ inputs.seed_tag }}

      - name: Generate aircraft.db
        run: |
          PREV_ARG=""
          if [ "${{ steps.prev-db.outputs.found }}" = "true" ]; then
            PREV_ARG="--previous-db /tmp/aircraft-build/aircraft.db"
          fi
          SEED_ARG=""
          if [ -f /tmp/aircraft-seed/aircraft.db ]; then
            SEED_ARG="--seed-db /tmp/aircraft-seed/aircraft.db"
          fi
          python3 generate_aircraft_db.py \
            $PREV_ARG $SEED_ARG \
            --output /tmp/aircraft-build/aircraft_new.db

      - name: Release gate - refuse a build that shrank suspiciously
        if: ${{ !inputs.allow_shrink }}
        run: |
          PREV_ARG=""
          if [ "${{ steps.prev-db.outputs.found }}" = "true" ]; then
            PREV_ARG="--previous /tmp/aircraft-build/aircraft.db"
          fi
          python3 check_db_shrink.py /tmp/aircraft-build/aircraft_new.db $PREV_ARG

      - name: Compute SHA-256 and version tag
        id: meta
        run: |
          SHA=$(shasum -a 256 /tmp/aircraft-build/aircraft_new.db | awk '{print $1}')
          TAG="aircraft-db-$(date -u +%Y%m%d)"
          # A second run on the same day (a manual recovery, then a seeded run) would
          # otherwise collide with that day's tag and fail at the upload step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="$TAG-$(date -u +%H%M)"
          fi
          echo "sha256=$SHA"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and write manifest.json
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          DATE: ${{ steps.meta.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          pip install cryptography --quiet
          python3 - <<'EOF'
          import os, base64, hashlib, json
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          priv = Ed25519PrivateKey.from_private_bytes(
              base64.b64decode(os.environ["SIGNING_PRIVATE_KEY"]))

          with open("/tmp/aircraft-build/aircraft_new.db", "rb") as f:
              sha256_hex = hashlib.sha256(f.read()).hexdigest()

          signature = base64.b64encode(priv.sign(sha256_hex.encode())).decode()

          tag, repo = os.environ["TAG"], os.environ["REPO"]
          manifest = {
              "version": tag,
              "date": os.environ["DATE"],
              "sha256": sha256_hex,
              "signature": signature,
              "url": f"https://github.com/{repo}/releases/download/{tag}/aircraft.db",
              "minAppVersion": "1.0"
          }
          with open("/tmp/aircraft-build/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"aircraft.db: sha256={sha256_hex[:16]}… sig={signature[:16]}…")
          print("Signed manifest written.")
          EOF
          cp /tmp/aircraft-build/aircraft_new.db /tmp/aircraft-build/aircraft.db

      - name: Create GitHub Release and upload assets
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Aircraft DB ${{ steps.meta.outputs.tag }}" \
            --notes "Weekly aircraft database update. SHA-256: ${{ steps.meta.outputs.sha256 }}" \
            /tmp/aircraft-build/aircraft.db \
            /tmp/aircraft-build/manifest.json \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
